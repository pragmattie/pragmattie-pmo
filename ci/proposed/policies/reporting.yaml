# How a status report rates a project in delivery (item 7.3). Drafted by an agent; a person
# applies it as policies/reporting.yaml.
#
# Each rating is green, amber or red, worked out by code from the report's figures. A rating is
# amber when its measure is above the amber limit and red when it is above the red limit (each
# red limit must be at least its amber limit). The overall rating is the worst of the four.
#
# - schedule: the most working days (Monday to Friday) any milestone is late against its target
#   in the current baseline, as of the period's last day. A milestone not yet reached counts to
#   that day.
# - cost: how far spending runs ahead of time, in percentage points: the spend to date as a
#   percentage of the current baseline total, less the share of the delivery time that has passed
#   by the period's last day (from baseline 1 to the latest milestone target in the current
#   baseline). Spending behind time is never above a limit.
# - scope: how far the current baseline total has moved from baseline 1's total through approved
#   change requests, as a percentage of baseline 1's total, either way.
# - risk: open risks by band. A rating applies when the count of open risks in any band it lists
#   reaches that number. Band names are the risk policy's.
version: 1
schedule:
  amber_above_working_days: 0
  red_above_working_days: 10
cost:
  amber_above_points: 5
  red_above_points: 15
scope:
  amber_above_pct: 5
  red_above_pct: 10
risk:
  amber_at:
    Medium: 1
    High: 1
  red_at:
    High: 2
