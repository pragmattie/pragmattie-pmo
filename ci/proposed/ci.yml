# Proposed CI workflow for item 2.4. A person copies it over .github/workflows/ci.yml.
# Changes from 1.2:
# - New job `API (security tests)` runs tests/security on its own. It is a new required check.
# - `API (migrations on MySQL)` installs the dev requirements (for pytest), points TEST_MYSQL_URL
#   at its throwaway MySQL service and, after the last `alembic upgrade head`, runs the tests
#   marked mysql with --require-mysql, so a skipped MySQL test fails the job.
# - New job `Dependency audit` runs pip-audit and `npm audit --omit=dev`. Report-only for now:
#   its steps continue on error, so it never blocks a merge. Not a required check.
# The existing job names are the main ruleset's required checks: do not rename them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  api-security:
    name: API (security tests)
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The two tests marked mysql skip here; the migrations job runs them on MySQL.
      - run: pytest -q tests/security

  api-migrations:
    name: API (migrations on MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          # Throwaway service container: no password, so there is no secret to store.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: pragmattie_pmo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      # APP_ENV=test: migrations need no JWT secret, and the workflow stays secret-free.
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://root@127.0.0.1:3306/pragmattie_pmo
      # The race tests empty and refill this throwaway database (tests/security/test_mysql_races.py).
      TEST_MYSQL_URL: mysql+pymysql://root@127.0.0.1:3306/pragmattie_pmo
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m app.dbcheck
      - run: alembic upgrade head
      - run: alembic check
      - run: alembic downgrade base
      - run: alembic upgrade head
      # Last admin and parallel login failures, on real row locks. --require-mysql fails the
      # step if either test is skipped (for example if TEST_MYSQL_URL goes missing).
      - run: pytest -m mysql --require-mysql -q

  web:
    name: Web (tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: pip install pip-audit==2.10.1
      # Report-only at first: findings show in the log but don't fail the run.
      - name: pip-audit (API)
        continue-on-error: true
        run: pip-audit -r apps/api/requirements-dev.txt
      - name: npm audit (web, runtime dependencies)
        continue-on-error: true
        working-directory: apps/web
        run: npm audit --omit=dev
