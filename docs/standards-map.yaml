# Standards traceability map. Every feature lists the rules it follows from
# policies/project-rules.md, so the standards lens (milestone P7) can show it. Served read-only at
# GET /api/v1/standards and validated by apps/api/app/standards.py.
#
# Rules for editing:
# - id is "P<milestone>-<slug>", so every plan milestone (P1 to P7) can be checked for an entry.
# - rules lists rule numbers from policies/project-rules.md, and may be empty when none applies.
# - Keep entries short: title + notes is at most 200 characters.
#
# Milestones follow the plan: P1 Foundation; P2 Login and roles; P3 Intake, planning baseline,
# proposals, status reports and closure; P4 Risk register; P5 Stage gates; P6 Portfolio dashboard
# and agent registry; P7 Demo and standards lens.
version: 1
features:
  # --- P1 Foundation
  - id: P1-audit-trail
    title: Append-only audit trail
    rules: [R5]
    notes: Every agent and human decision is one row; corrections add a row, never edit one.
  - id: P1-policy-loader
    title: Governance policies with strict validation
    rules: [R3, R7, R8]
    notes: Tiers, risk thresholds and approvers come from files a person applies, not from code.
  - id: P1-seed-portfolio
    title: Fictional demo clients and portfolio
    rules: []
    notes: Invented clients on the .example domain; no real people or companies.
  - id: P1-standards-map
    title: Standards traceability map
    rules: []
    notes: Lists the rules each feature follows.
  - id: P1-agent-build-workflow
    title: Audited agent build workflow
    rules: [R1, R4, R5]
    notes: A person approves each spec and merge; every run records model, tokens and cost.
  # --- P2 Login and roles
  - id: P2-login-and-roles
    title: Login, roles and route guards
    rules: [R6]
    notes: Argon2id passwords, short signed sessions with CSRF checks; every route needs a permission; no self-approval.
  - id: P2-roles
    title: Roles and route guards
    rules: [R1, R6]
    notes: One permissions table; every route needs a guard; only admins change roles, never their own, and each change is audited.
  - id: P2-login-audit
    title: Login audit, lockout and rate limits
    rules: [R5, R6]
    notes: Sign-in events are audited without secrets; repeated failures lock an account; per-IP throttling.
  # --- P3 Intake, planning baseline, proposals, status reports and closure
  - id: P3-project-intake
    title: Project and work-item intake
    rules: [R1, R11]
    notes: An agent may propose a triage; a person authorises the project.
  - id: P3-client-proposals
    title: Client proposal workflow
    rules: [R1]
    notes: An agent may draft; a person commits the price and sends the document.
  - id: P3-status-reports
    title: Status reports
    rules: [R1, R5]
    notes: Agent drafts are proposals; a person edits and releases each report.
  - id: P3-closure
    title: Closure report and lessons learned
    rules: []
    notes: A closure report and lessons learned are recorded when a project ends.
  # --- P4 Risk register
  - id: P4-risk-register
    title: Risk register
    rules: [R7, R8, R9, R10]
    notes: Threats and opportunities scored against the risk policy; a person accepts a risk.
  # --- P5 Stage gates
  - id: P5-stage-gates
    title: Stage gates
    rules: [R1, R3]
    notes: Gates sit between project stages; criteria come from policy and only a person approves a gate.
  # --- P6 Portfolio dashboard and agent registry
  - id: P6-portfolio-dashboard
    title: Portfolio dashboard
    rules: [R5]
    notes: Health, budget and risk across projects, from recorded data only.
  - id: P6-agent-registry
    title: Agent registry
    rules: [R2, R4, R5]
    notes: Each agent's purpose, limits, mode and owner, with its run history.
  # --- P7 Demo and standards lens
  - id: P7-standards-lens
    title: Standards lens
    rules: []
    notes: Shows each feature with the rules it follows, from this file.
