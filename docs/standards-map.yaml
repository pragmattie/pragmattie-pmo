# Standards traceability map. Every feature lists the rules it follows from
# policies/project-rules.md, so the standards lens (milestone P7) can show it. Served read-only at
# GET /api/v1/standards and validated by apps/api/app/standards.py.
#
# Rules for editing:
# - id is "P<milestone>-<slug>", so every plan milestone (P1 to P8) can be checked for an entry.
# - rules lists rule numbers from policies/project-rules.md, and may be empty when none applies.
# - Keep entries short: title + notes is at most 200 characters.
#
# Milestones follow docs/roadmap.md: P1 Foundation; P2 Login and roles; P3 Risk register; P4 Intake
# and the approval gate; P5 Planning, proposals and the go-ahead gate; P6 Delivery and closure;
# P7 Portfolio and oversight; P8 Demo.
version: 1
features:
  # --- P1 Foundation
  - id: P1-audit-trail
    title: Append-only audit trail
    rules: [R5]
    notes: Every agent and human decision is one row; corrections add a row, never edit one.
  - id: P1-policy-loader
    title: Governance policies with strict validation
    rules: [R3, R7, R8]
    notes: Tiers, risk thresholds and approvers come from files a person applies, not from code.
  - id: P1-seed-portfolio
    title: Fictional demo clients and portfolio
    rules: []
    notes: Invented clients on the .example domain; no real people or companies.
  - id: P1-standards-map
    title: Standards traceability map
    rules: []
    notes: Lists the rules each feature follows.
  - id: P1-agent-build-workflow
    title: Audited agent build workflow
    rules: [R1, R4, R5]
    notes: A person approves each spec and merge; every run records model, tokens and cost.
  # --- P2 Login and roles
  - id: P2-login-and-roles
    title: Login, roles and route guards
    rules: [R6]
    notes: Argon2id passwords, short signed sessions with CSRF checks; every route needs a permission; no self-approval.
  - id: P2-roles
    title: Roles and route guards
    rules: [R1, R6]
    notes: One permissions table; every route needs a guard; only admins change roles, never their own, and each change is audited.
  - id: P2-login-audit
    title: Login audit, lockout and rate limits
    rules: [R5, R6]
    notes: Sign-in events are audited without secrets; repeated failures lock an account; per-IP throttling.
  - id: P2-security-tests
    title: Security tests and threat notes
    rules: [R6, R10]
    notes: Threats incl. AI ones, each with mitigation and test, seed the risk register; reviews each milestone, quarter and auth change.
  - id: P2-demo-users
    title: Demo users and secret scan
    rules: [R6]
    notes: One demo user per role; random passwords shown once, never stored in plaintext; a test scans tracked files for keys, tokens and passwords.
  # --- P3 Risk register
  - id: P3-risk-register
    title: Risk register
    rules: [R5, R7, R8, R9, R10]
    notes: >-
      Threats and opportunities, AI and project, scored by the server from the risk policy;
      judgement risks wait for a person's score; each change is one audit row; a person accepts.
  - id: P3-risk-library
    title: Starter risk library
    rules: [R5, R10]
    notes: >-
      AI and project risk templates, strictly validated; added risks are proposed and unscored,
      one audit row each; seeded risks cover every band.
  - id: P3-risk-register-screen
    title: Risk register screen
    rules: [R5, R8, R9, R12]
    notes: >-
      Heat map on the shared scales for threats and opportunities; judgement risks show they need a
      person; history from the audit trail; only a project manager sees change buttons.
  - id: P3-risk-escalation
    title: Escalation and acceptance
    rules: [R1, R3, R7, R9]
    notes: >-
      Bands name their owner in policy; only a person at or above it accepts (reason, review
      date), closes or lowers an escalated risk; rejected risks are final; all audited.
  - id: P3-risk-agent
    title: Risk agent
    rules: [R1, R2, R4, R5, R9]
    notes: >-
      Proposes up to five unscored risks for a person to open or reject; AGENT_MODE can stop it;
      limits in docs/agents.md, enforced in code; each run audited; judgement risks stay unscored.
  # --- P4 Intake and the approval gate
  - id: P4-project-intake
    title: Project requests, value case and readiness check
    rules: [R1, R11]
    notes: An agent may draft the value case and readiness check; a person passes the approval gate.
  - id: P4-project-requests
    title: Project requests and the queue
    rules: [R1, R5, R12]
    notes: Project managers draft, submit and withdraw; only the approval gate approves or declines; each change audited.
  - id: P4-value-case
    title: The value case
    rules: [R1, R5, R12]
    notes: Benefits, estimated cost and strategic fit; a person confirms an agent's draft before the request is submitted; each change audited.
  - id: P4-readiness-check
    title: The readiness check
    rules: [R1, R5, R11, R12]
    notes: Problem, approach and data rated green, yellow or red; yellow needs an owned, dated action; a person confirms before an AI request is submitted; each change audited.
  - id: P4-gates
    title: Gates and the approval gate
    rules: [R1, R3, R5, R11, R12]
    notes: Criteria and deciders come from policy; only a listed person, never the requester, decides; red readiness blocks a pass; each decision and refusal audited.
  - id: P4-intake-agent
    title: Intake agent
    rules: [R1, R2, R4, R5, R9, R11]
    notes: Drafts an unconfirmed value case and readiness check; never rates green; concerns left to a person; AGENT_MODE can stop it; each run audited.
  - id: P4-project-from-approval
    title: From approval to project
    rules: [R1, R5, R10, R12]
    notes: A sponsor's pass names the project manager; project, brief, stakeholders and unscored proposed AI and project risks made in one transaction; each edit audited.
  - id: P4-brief-links
    title: A way back to the project's brief
    rules: [R6, R12]
    notes: The request and Risks pages link back to the project's brief for anyone with project:read; the project page checks access itself.
  # --- P5 Planning, proposals and the go-ahead gate
  - id: P5-project-plan
    title: The project plan
    rules: [R1, R5, R12]
    notes: People write scope, milestones, estimate and reporting; the total is computed, never typed; each change is one audit row.
  - id: P5-client-proposals
    title: Client proposal workflow
    rules: [R1, R5, R9, R12]
    notes: Price, dates and deliverables come from the plan by code; a checker blocks submit and sent; the sponsor approves; a person records sending; no risk score shown; all audited.
  - id: P5-proposal-agent
    title: Proposal agent
    rules: [R1, R2, R4, R5, R9]
    notes: Drafts proposal text only; code fills figures and dates from tokens and removes any it wrote; never replaces a person's section; unreviewed drafts block submit; each run audited.
  - id: P5-go-ahead-gate
    title: The go-ahead gate and the baseline
    rules: [R1, R3, R5, R7, R9, R11]
    notes: A sponsor passes it with every check met; passing freezes the plan as baseline 1; open escalations and red AI readiness block it; each decision and refusal audited.
  # --- P6 Delivery and closure
  - id: P6-status-reports
    title: Status reports
    rules: [R1, R5]
    notes: Agent drafts are proposals; a person edits and releases each report.
  - id: P6-closure
    title: Closure report and lessons
    rules: []
    notes: A closure report and lessons are recorded when a project ends.
  # --- P7 Portfolio and oversight
  - id: P7-portfolio-dashboard
    title: Portfolio dashboard
    rules: [R5]
    notes: Health, budget and risk across projects, from recorded data only.
  - id: P7-agent-registry
    title: Agent registry
    rules: [R2, R4, R5]
    notes: Each agent's purpose, limits, mode and owner, with its run history.
  # --- P8 Demo
  - id: P8-standards-lens
    title: Standards lens
    rules: []
    notes: Shows each feature with the rules it follows, from this file.
